name: "AccessDoc Evidence Gate"
description: "Generate a tamper-evident WCAG accessibility evidence bundle (PDF, OpenACR, SARIF, in-toto receipt) and gate CI on severity."
author: "AccessDoc"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  axe-json:
    description: "Path to an axe-core results JSON file."
    required: true
  fail-on:
    description: "Severity threshold that fails the build: critical | high | medium | none."
    required: false
    default: "critical"
  client-name:
    description: "Name used in generated reports."
    required: false
    default: "CI Audit"
  output-dir:
    description: "Directory for the generated bundle + SARIF."
    required: false
    default: "./accessdoc-out"
  sarif:
    description: "Also emit findings.sarif.json for GitHub Code Scanning."
    required: false
    default: "true"
  manual-findings:
    description: "Optional path to a CSV/Markdown file of manual findings to merge."
    required: false
    default: ""

outputs:
  bundle-path:
    description: "Path to the generated evidence bundle zip."
    value: ${{ steps.run.outputs.bundle-path }}
  sarif-path:
    description: "Path to the generated SARIF file (if enabled)."
    value: ${{ steps.run.outputs.sarif-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install AccessDoc
      shell: bash
      env:
        ACCESSDOC_ACTION_PATH: ${{ github.action_path }}
      run: python3 -m pip install -r "$ACCESSDOC_ACTION_PATH/requirements.txt"
    - name: Run AccessDoc evidence gate
      id: run
      shell: bash
      env:
        ACCESSDOC_AXE_JSON: ${{ inputs.axe-json }}
        ACCESSDOC_FAIL_ON: ${{ inputs.fail-on }}
        ACCESSDOC_CLIENT_NAME: ${{ inputs.client-name }}
        ACCESSDOC_OUTPUT_DIR: ${{ inputs.output-dir }}
        ACCESSDOC_SARIF: ${{ inputs.sarif }}
        ACCESSDOC_MANUAL_FINDINGS: ${{ inputs.manual-findings }}
        ACCESSDOC_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Reject line breaks before writing GitHub's line-oriented output file.
        if [[ "$ACCESSDOC_OUTPUT_DIR" == *$'\n'* || "$ACCESSDOC_OUTPUT_DIR" == *$'\r'* ]]; then
          echo "output-dir must not contain line breaks" >&2
          exit 2
        fi
        args=(
          --axe-json "$ACCESSDOC_AXE_JSON"
          --fail-on "$ACCESSDOC_FAIL_ON"
          --client-name "$ACCESSDOC_CLIENT_NAME"
          --output-dir "$ACCESSDOC_OUTPUT_DIR"
        )
        if [ "$ACCESSDOC_SARIF" = "true" ]; then args+=(--sarif); fi
        if [ -n "$ACCESSDOC_MANUAL_FINDINGS" ]; then args+=(--manual-findings "$ACCESSDOC_MANUAL_FINDINGS"); fi
        status=0
        python3 "$ACCESSDOC_ACTION_PATH/scripts/ci_gate.py" "${args[@]}" || status=$?
        # A severity gate failure still produces reviewable evidence. A build
        # error must not publish paths to stale artifacts from a previous run.
        if [ "$status" -eq 0 ] || [ "$status" -eq 1 ]; then
          printf 'bundle-path=%s/accessdoc-bundle.zip\n' "$ACCESSDOC_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          if [ "$ACCESSDOC_SARIF" = "true" ]; then
            printf 'sarif-path=%s/findings.sarif.json\n' "$ACCESSDOC_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          fi
        fi
        exit "$status"

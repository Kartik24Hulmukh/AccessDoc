name: diagnose-pr-context

on:
  pull_request:

permissions:
  contents: read

jobs:
  fresh-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install --requirement requirements-dev.txt
      - run: |
          python -c "from app.service import build_artifacts; from app.bundle import build_bundle; open('/tmp/fresh_bundle.zip', 'wb').write(build_bundle(build_artifacts({'scanner_input': open('fixtures/axe-sample.json', encoding='utf-8').read(), 'client_name': 'Fresh CI Client'})))"
          python scripts/verify_bundle.py /tmp/fresh_bundle.zip

  hostile-fixture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - corrupt_zip.zip
          - extra_member.zip
          - manifest_digest_mismatch.zip
          - missing_member.zip
          - not_a_pdf.zip
          - oversize.zip
          - resealed_manifest.zip
          - tampered_member.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install --requirement requirements-dev.txt
      - name: Require hostile fixture rejection
        run: |
          if python scripts/verify_bundle.py "tests/fixtures/hostile/${{ matrix.fixture }}"; then
            echo "GATE FAIL: hostile fixture unexpectedly passed"
            exit 1
          fi
          echo "Hostile fixture rejected as required"

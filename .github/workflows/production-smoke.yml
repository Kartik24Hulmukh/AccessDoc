# Post-deployment production smoke tests for AccessDoc.
#
# Runs after a production deployment is ready. Verifies the live Vercel
# endpoint responds correctly and that generated receipts use schema 1.2
# (NOT schema 1.1). Fails if any check fails.
#
# Bounded retries while Vercel deploys: poll every 15 seconds, max 15 minutes,
# request timeout on every request.
name: production-smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Commit-specific AccessDoc preview URL or production origin
        required: false
        default: 'https://access-doc.vercel.app'
      expected_version:
        description: Expected adapter_version / accessdoc_version string
        required: false
        default: '0.7.0-beta.7'
  push:
    branches:
      - main
  # Production drift is only real if it is detected without a human
  # remembering to look. A deploy-time check proves the deploy was good;
  # a daily check proves it is STILL good after cache rotation, upstream
  # runtime changes, or a rollback nobody announced.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: ${{ github.event.inputs.target_url || 'https://access-doc.vercel.app' }}
      EXPECTED_VERSION: ${{ github.event.inputs.expected_version || '0.7.0-beta.7' }}
      TARGET_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install reportlab PyYAML

      - name: Install axe-core locally
        run: npm install axe-core@4.11.2

      - name: Wait for exact Vercel deployment and run smoke tests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python scripts/production_smoke.py --output production-smoke.json
      - name: Archive exact-target smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-${{ github.sha }}
          path: production-smoke.json

name: source-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: pip install --requirement requirements-dev.txt
      - name: Install required browser and accessibility-test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          npm install --no-save --package-lock=false axe-core@4.11.0
      - run: python scripts/verify_release.py
      - run: python scripts/build_source_bundle.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

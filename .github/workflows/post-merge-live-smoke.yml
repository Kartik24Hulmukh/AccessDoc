name: post-merge-live-smoke

on:
  push:
    branches:
      - fix/stress-evidence-validation-2026-09-01

permissions: {}

jobs:
  live-deployment-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact merged deployment
        run: |
          python - <<'PY'
          import json
          import urllib.request

          expected = "b75b41b4cabada2714508cadd03582b12efe7a1d"
          with urllib.request.urlopen("https://access-doc.vercel.app/readyz", timeout=20) as response:
              assert response.status == 200
              assert response.headers.get_content_type() == "application/json"
              health = json.loads(response.read())
          assert health["status"] == "ok", health
          assert health["commit"] == expected, health
          print(json.dumps(health, indent=2))
          PY

  live-valid-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Require valid six-member evidence ZIP
        run: |
          python - <<'PY'
          import io
          import json
          import urllib.request
          import zipfile

          base = "https://access-doc.vercel.app"
          scanner = {
              "url": "https://example.com",
              "testEngine": {"name": "axe-core", "version": "4.11.2"},
              "violations": [{
                  "id": "image-alt",
                  "impact": "critical",
                  "description": "Images must have alternate text",
                  "helpUrl": "https://dequeuniversity.com/rules/axe/4.11/image-alt",
                  "nodes": [{"target": ["img.hero"]}],
              }],
              "passes": [],
              "incomplete": [],
          }
          body = {
              "client_name": "Post-merge smoke",
              "audit_date": "2026-09-01",
              "scanner_input": json.dumps(scanner),
          }
          request = urllib.request.Request(
              base + "/api/bundle",
              data=json.dumps(body).encode("utf-8"),
              headers={"Content-Type": "application/json", "Origin": base},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 200
              assert response.headers.get_content_type() == "application/zip"
              assert response.headers.get("X-Content-Type-Options") == "nosniff"
              assert "no-store" in response.headers.get("Cache-Control", "")
              bundle = response.read()
          expected = {
              "report.pdf",
              "report.html",
              "receipt.json",
              "openacr.yaml",
              "attestation.intoto.json",
              "manifest.json",
          }
          with zipfile.ZipFile(io.BytesIO(bundle)) as archive:
              members = archive.namelist()
              assert set(members) == expected, members
              assert len(members) == len(expected), members
              receipt = json.loads(archive.read("receipt.json"))
              manifest = json.loads(archive.read("manifest.json"))
          assert receipt["schema_version"] == "1.2", receipt
          assert receipt["engine_version"] == "4.11.2", receipt
          assert receipt["summary"]["total_violations"] == 1, receipt
          assert len(manifest.get("files", {})) == 5, manifest
          print(json.dumps({
              "status": "PASS",
              "bundle_bytes": len(bundle),
              "members": members,
              "receipt_schema": receipt["schema_version"],
              "engine_version": receipt["engine_version"],
              "total_violations": receipt["summary"]["total_violations"],
          }, indent=2))
          PY

  live-invalid-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Require generic bounded 422 responses
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          endpoint = "https://access-doc.vercel.app/api/bundle"

          def expect_422(name, scanner_input):
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps({"scanner_input": scanner_input}).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  urllib.request.urlopen(request, timeout=20)
              except urllib.error.HTTPError as error:
                  assert error.code == 422, (name, error.code)
                  assert error.headers.get_content_type() == "application/json"
                  payload = json.loads(error.read())
                  assert set(payload) == {"error", "request_id"}, payload
                  assert payload["error"] == "Invalid axe-core data", payload
                  assert payload["request_id"], payload
                  serialized = json.dumps(payload)
                  for forbidden in ("Traceback", ".py", "Exception", "/var/task"):
                      assert forbidden not in serialized, (name, serialized)
                  return {"status": error.code, "request_id_present": True}
              raise AssertionError(f"{name} unexpectedly returned success")

          results = {
              "scalar_violation": expect_422("scalar_violation", {"violations": [42]}),
              "wrong_engine_type": expect_422(
                  "wrong_engine_type",
                  {"violations": [], "testEngine": []},
              ),
          }
          print(json.dumps(results, indent=2))
          PY

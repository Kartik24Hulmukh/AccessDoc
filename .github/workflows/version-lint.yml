# .github/workflows/version-lint.yml
# This job makes VERSION canonical and fails the build on any disagreement.
name: version-lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Every declared version must equal VERSION
        run: python scripts/version_lint.py
      - name: No UTF-8 BOM in any tracked file
        run: python scripts/bom_lint.py
      - name: Config files parse as strict JSON
        run: python scripts/config_lint.py

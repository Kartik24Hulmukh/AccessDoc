name: AccessDoc Evidence Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessdoc-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install reportlab PyYAML playwright
          python -m playwright install --with-deps chromium

      - name: Run unittest suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run stress test
        run: python3 scripts/stress_test.py

      - name: Reproducibility gate
        run: |
          python3 cli.py bundle fixtures/axe-sample.json \
            --client-name "CI Gate" --audit-date 2026-07-25 \
            --sarif --vpat --eaa --out /tmp/a.zip
          sleep 3
          python3 cli.py bundle fixtures/axe-sample.json \
            --client-name "CI Gate" --audit-date 2026-07-25 \
            --sarif --vpat --eaa --out /tmp/b.zip
          A=$(sha256sum /tmp/a.zip | cut -d' ' -f1)
          B=$(sha256sum /tmp/b.zip | cut -d' ' -f1)
          echo "run1=$A"
          echo "run2=$B"
          test "$A" = "$B" || { echo "NON-DETERMINISTIC"; exit 1; }

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessdoc-ci-bundle
          path: /tmp/a.zip
          retention-days: 14
          if-no-files-found: warn

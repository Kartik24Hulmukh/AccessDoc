name: AccessDoc Evidence Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessdoc-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install reportlab PyYAML playwright
          python -m playwright install --with-deps chromium

      - name: Install pinned axe-core (local, no CDN)
        run: |
          npm install axe-core@4.11.2
          AXE_PATH=$(node -p "require.resolve('axe-core/axe.min.js')")
          echo "ACCESSDOC_AXE_PATH=$AXE_PATH" >> "$GITHUB_ENV"

      - name: Run unittest suite
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run stress test
        run: python3 scripts/stress_test.py

      - name: Reproducibility gate
        run: |
          python3 cli.py bundle fixtures/axe-sample.json \
            --client-name "CI Gate" --audit-date 2026-07-25 \
            --sarif --vpat --eaa --out /tmp/a.zip
          sleep 3
          python3 cli.py bundle fixtures/axe-sample.json \
            --client-name "CI Gate" --audit-date 2026-07-25 \
            --sarif --vpat --eaa --out /tmp/b.zip
          A=$(sha256sum /tmp/a.zip | cut -d' ' -f1)
          B=$(sha256sum /tmp/b.zip | cut -d' ' -f1)
          echo "run1=$A"
          echo "run2=$B"
          test "$A" = "$B" || { echo "NON-DETERMINISTIC"; exit 1; }

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessdoc-ci-bundle
          path: /tmp/a.zip
          retention-days: 14
          if-no-files-found: warn

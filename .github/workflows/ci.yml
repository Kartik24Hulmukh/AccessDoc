name: accessdoc-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install --requirement requirements-dev.txt
      - name: Install Playwright & axe-core for Required Self-Audit
        run: |
          pip install playwright
          playwright install chromium --with-deps
          npm install --no-save --package-lock=false axe-core@4.11.0
      - name: Run axe-core self-audit against AccessDoc HTML outputs
        run: python scripts/self_audit.py
      - name: Archive axe-core self-audit JSON report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: axe-self-audit
          path: axe-self-audit.json
      - name: Validate generated OpenACR against GSA CLI validator
        shell: bash
        run: |
          git clone --depth 1 https://github.com/GSA/openacr.git /tmp/openacr-upstream
          cd /tmp/openacr-upstream && npm ci && cd $GITHUB_WORKSPACE
          python -c "from app.service import build_artifacts; open('/tmp/test_acr.yaml', 'w', encoding='utf-8').write(build_artifacts({'scanner_input': open('fixtures/axe-sample.json', encoding='utf-8').read(), 'client_name': 'CI Test Client'}).openacr_yaml)"
          npx --prefix /tmp/openacr-upstream ts-node /tmp/openacr-upstream/src/openacr.ts validate -f /tmp/test_acr.yaml 2>&1 | tee /tmp/gsa.out
          grep -q "Invalid" /tmp/gsa.out && { echo "GATE FAIL: GSA validator reported Invalid"; exit 1; }
          grep -q "Valid\!" /tmp/gsa.out || { echo "GATE FAIL: GSA validator did not report Valid!"; exit 1; }
      - name: Verify generated bundle and hostile fixtures with shipped verifier
        run: |
          python -c "from app.service import build_artifacts; from app.bundle import build_bundle; open('/tmp/fresh_bundle.zip', 'wb').write(build_bundle(build_artifacts({'scanner_input': open('fixtures/axe-sample.json', encoding='utf-8').read(), 'client_name': 'Fresh CI Client'})))"
          python scripts/verify_bundle.py /tmp/fresh_bundle.zip || { echo "GATE FAIL: fresh bundle failed shipped verifier"; exit 1; }
          for fix in tests/fixtures/hostile/*.zip; do
            echo "Testing hostile fixture $fix..."
            python scripts/verify_bundle.py "$fix" && { echo "GATE FAIL: hostile fixture $fix unexpectedly passed (exit 0)"; exit 1; }
          done
          echo "All hostile fixtures rejected by shipped verifier with non-zero exits."
      - name: Bounded local concurrency and malformed-input contract gate
        run: python scripts/hardening_load.py --output hardening-load.json
      - name: Local authenticated overload and recovery gate (both adapters)
        run: python scripts/hosted_soak.py --seconds 5 --workers 8 --output hosted-soak.json
      - name: Offline Melious gateway resilience gate (429 failover, 503 fail-fast, static-KB)
        run: python scripts/gateway_bench.py --probes-only --output gateway-probes.json
      - name: Archive hosted soak metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-soak
          path: hosted-soak.json
      - name: Archive local hardening metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardening-load
          path: hardening-load.json
      - run: python -m compileall -q app api tests
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Collect all tests including function-based gateway regressions
        run: python -m pytest tests -q
      - run: find . -type d -name __pycache__ -exec rm -rf {} +
      - run: python scripts/verify_release.py
      - run: docker build -t accessdoc:${{ github.sha }} .
      - run: |
          docker run -d --name accessdoc -p 127.0.0.1:8000:8000 -e ALLOWED_HOSTS=127.0.0.1:8000 accessdoc:${{ github.sha }}
          python scripts/smoke.py http://127.0.0.1:8000
          docker logs accessdoc
          docker rm -f accessdoc

  portability:
    # Non-POSIX / non-Linux gate. Every defect fixed in PR #73 (top-level
    # `resource` import, POSIX-only RSS probe, 413-as-TCP-reset, CRLF asset
    # hashes) was invisible to the ubuntu-only matrix. This job makes that
    # whole class of regression fail at PR time.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install --requirement requirements-dev.txt
      - run: python -m compileall -q app api tests
      - name: Application imports cleanly on this platform
        run: python -c "import app.main, api.handler, app.procstats; print(app.procstats.process_stats())"
      - name: Full test suite
        run: python -m pytest tests -q --junitxml=portability-results.xml
      - name: Publish bounded failed-test diagnostics
        if: failure()
        run: python scripts/report_test_failures.py portability-results.xml
      # One fresh phase observation; no retry or acceptance override.
      - name: One bounded first-export phase observation
        if: ${{ !cancelled() && github.event_name == 'push' && matrix.os == 'macos-latest' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[export-phase-numeric-once-oct04]') }}
        timeout-minutes: 1
        shell: bash
        run: PYTHONPATH=. python scripts/diagnose_export_phase_once.py
      - name: Bounded local concurrency and malformed-input contract gate
        run: python scripts/hardening_load.py --output hardening-load-${{ matrix.os }}.json
      - name: Archive portability load metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardening-load-${{ matrix.os }}
          path: hardening-load-${{ matrix.os }}.json

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependency-scope: [runtime, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install and freeze the selected candidate scope
        env:
          DEPENDENCY_SCOPE: ${{ matrix.dependency-scope }}
        run: |
          python -m venv .candidate-venv
          .candidate-venv/bin/python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps --requirement requirements-installer.txt
          case "$DEPENDENCY_SCOPE" in
            runtime) requirement=requirements.txt ;;
            dev) requirement=requirements-dev.txt ;;
            *) echo "Unknown dependency scope"; exit 1 ;;
          esac
          .candidate-venv/bin/python -m pip install --requirement "$requirement"
          .candidate-venv/bin/python -m pip check
          .candidate-venv/bin/python -m pip freeze > dependency-snapshot.txt
          .candidate-venv/bin/python -m pip freeze --all > installed-environment-snapshot.txt
          .candidate-venv/bin/python -c "import importlib.metadata; print('pip==' + importlib.metadata.version('pip'))" > installer-snapshot.txt
      - name: Install audit tooling outside the candidate environment
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps --requirement requirements-installer.txt
          .audit-venv/bin/python -m pip install pip-audit==2.10.1
      - name: Fail closed on selected-scope advisories and emit dependency SBOM
        run: |
          .audit-venv/bin/python -m pip_audit --disable-pip --no-deps -r dependency-snapshot.txt --format cyclonedx-json --output dependency-audit.cdx.json
      - name: Reject skipped, unqueryable or incomplete scope audit coverage
        if: ${{ !cancelled() }}
        run: |
          .audit-venv/bin/python -m pip_audit --disable-pip --no-deps -r dependency-snapshot.txt --format json --output dependency-audit.json
          .audit-venv/bin/python scripts/audit_dependency_snapshot.py --snapshot dependency-snapshot.txt --audit-json dependency-audit.json
      - name: Audit installer tooling separately from application dependencies
        if: ${{ !cancelled() }}
        run: |
          .audit-venv/bin/python -m pip_audit --disable-pip --no-deps -r installer-snapshot.txt --format cyclonedx-json --output installer-audit.cdx.json
      - name: Reject skipped, unqueryable or incomplete installer audit coverage
        if: ${{ !cancelled() }}
        run: |
          .audit-venv/bin/python -m pip_audit --disable-pip --no-deps -r installer-snapshot.txt --format json --output installer-audit.json
          .audit-venv/bin/python scripts/audit_dependency_snapshot.py --snapshot installer-snapshot.txt --audit-json installer-audit.json
      - name: Archive scope snapshots and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-${{ matrix.dependency-scope }}-${{ github.sha }}
          path: |
            dependency-snapshot.txt
            installed-environment-snapshot.txt
            installer-snapshot.txt
            dependency-audit.cdx.json
            dependency-audit.json
            installer-audit.cdx.json
            installer-audit.json

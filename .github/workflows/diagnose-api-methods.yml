name: diagnose-api-methods

on:
  pull_request:

permissions:
  contents: read

jobs:
  api-method:
    name: api-${{ matrix.method }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method:
          - test_oversized_content_length_returns_413
          - test_negative_content_length_returns_400
          - test_malformed_json_returns_400
          - test_missing_scanner_input_returns_400
          - test_unsupported_content_type_returns_415
          - test_internal_exception_returns_500_no_leakage
          - test_unknown_path_returns_404
          - test_unknown_path_post_returns_404
          - test_put_returns_405
          - test_delete_returns_405
          - test_valid_request_returns_200_with_zip
          - test_security_headers_present
          - test_missing_content_length_returns_411
          - test_structurally_invalid_axe_returns_422
          - test_scanner_input_not_object_returns_422
          - test_too_many_violations_returns_413
          - test_pdf_engine_weasyprint_not_exposed
          - test_receipt_history_not_exposed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: pip install reportlab PyYAML jsonschema
      - run: python -W error::ResourceWarning -m unittest tests.test_api_hardening.ApiHardeningTests.${{ matrix.method }} -v
